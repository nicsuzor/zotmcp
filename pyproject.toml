[project]
name = "zotmcp"
version = "0.1.0"
description = "MCP server for semantic search of Zotero academic library"
authors = [{ name = "Nicolas Suzor", email = "nic@suzor.com" }]
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=0.2.0",
  "pydantic>=2.0.0",
  "buttermilk @ git+https://github.com/qut-dmrc/buttermilk.git",
  "pyzotero>=1.6.17",
  "httpx>=0.27.0",
  "langdetect>=1.0.9",
  "rapidfuzz>=3.0.0",
  "google-auth-oauthlib>=1.0.0",
]

[dependency-groups]
dev = [
  "anyio>=4.11.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=0.24.0",
  "pytest-httpx>=0.30.0",
  "pytest-lazy-fixtures>=1.0.0",
  "requests>=2.31.0",
  "respx>=0.21.0",
]

[project.scripts]
zotmcp = "zotmcp.main:main"
zotmcp-download = "zotmcp.download:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zotmcp = ["conf/*.yaml", "conf/**/*.yaml", "conf/__init__.py", "conf/db/__init__.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Run tests sequentially (no -n flag) due to session-scoped ChromaDB fixtures
# --forked not used as it conflicts with session-scoped async fixtures
addopts = ["-v", "-rxX", "--capture=fd", "--tb=short", "-m not slow"]
filterwarnings = [
  "ignore::DeprecationWarning:buttermilk.*:",
  "ignore::pydantic.warnings.PydanticDeprecatedSince20:",
]
