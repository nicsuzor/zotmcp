name: Build and Push ZotMCP Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ vars.GCP_WIF_PROVIDER }}"
          service_account: "${{ vars.SERVICE_ACCOUNT_EMAIL }}"

      - name: Set up gcloud SDK
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          version: ">= 363.0.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Register gcloud as Docker credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # ChromaDB is no longer baked into the image — it is rsynced from GCS
      # into a named volume by deploy/sync-chromadb.sh on container start.
      # That removed the need for the previous "free disk space" hack and the
      # multi-GB download step in CI.

      - name: Checkout buttermilk source (build context)
        uses: actions/checkout@v4
        with:
          repository: qut-dmrc/buttermilk
          path: .cache/buttermilk
          fetch-depth: 1

      - name: Set Docker tag
        id: docker_tag
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo $BRANCH_NAME | sed 's/\//-/g')
          echo "branch_tag=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "Building for branch: $BRANCH_NAME (tag: $SAFE_BRANCH)"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          # arm64 is intentionally not built: the buttermilk:dev base image
          # only ships a linux/amd64 manifest. Re-add arm64 once buttermilk
          # publishes a multi-arch base.
          platforms: linux/amd64
          file: ./deploy/Dockerfile
          # Dockerfile expects a `buttermilk_src` named build context.
          # ChromaDB is mounted at runtime — no build context needed for it.
          build-contexts: |
            buttermilk_src=.cache/buttermilk
          tags: |
            us-central1-docker.pkg.dev/prosocial-443205/reg/zotmcp:${{ steps.docker_tag.outputs.branch_tag }}
            us-central1-docker.pkg.dev/prosocial-443205/reg/zotmcp:latest
            us-central1-docker.pkg.dev/prosocial-443205/reg/zotmcp:${{ steps.docker_tag.outputs.branch_tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Docker image built and pushed!"
          echo ""
          echo "📦 Tags:"
          echo "  - us-central1-docker.pkg.dev/prosocial-443205/reg/zotmcp:${{ steps.docker_tag.outputs.branch_tag }}"
          echo "  - us-central1-docker.pkg.dev/prosocial-443205/reg/zotmcp:latest"
          echo "  - us-central1-docker.pkg.dev/prosocial-443205/reg/zotmcp:${{ steps.docker_tag.outputs.branch_tag }}-${{ github.sha }}"
          echo ""
          echo "ℹ️  ChromaDB is no longer bundled — runtime hosts must mount a"
          echo "    named volume at /chromadb. Sync from GCS happens automatically"
          echo "    on container start (override with ZOTMCP_SKIP_SYNC=1)."
