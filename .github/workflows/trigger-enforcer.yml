# Axiom enforcer (rbg) — cross-repo shim.
# Calls agent-enforcer.yml from nicsuzor/academicOps as a reusable workflow.
# §9 canonical cross-repo install pattern.
# See: nicsuzor/academicOps/specs/workflows/pr-pipeline.md §9
# Related: nicsuzor/academicOps issue #633

name: "Trigger: Enforcer"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  enforce:
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      id-token: write
      issues: write
      actions: read
    uses: nicsuzor/academicOps/.github/workflows/agent-enforcer.yml@dev
    with:
      pr_number: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.ref }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      AOPS_BOT_GH_TOKEN: ${{ secrets.AOPS_BOT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
