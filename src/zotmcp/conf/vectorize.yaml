# @package _global_
# Zotero Vectorization Pipeline for ZotMCP
# Inherits shared infrastructure from config.yaml
#
# Usage: python -m buttermilk.runner.cli --config-dir conf --config-name vectorize

defaults:
  - zotero # Inherit base configuration
  - db: upstream # Use upstream GCS bucket for vectorization
  - _self_

# Pipeline specific configuration
job: vectorize_zotero

run:
  mode: pipeline
  limit: 10
  pipeline: ${pipeline}

session:
  template_paths:
    - templates

vectoriser:
  _target_: buttermilk.data.vector.ChromaDBEmbeddings
  persist_directory: ${storage.zotero_vectors.persist_directory}
  collection_name: ${storage.zotero_vectors.collection_name}
  embedding_model: ${storage.zotero_vectors.embedding_model}
  dimensionality: ${storage.zotero_vectors.dimensionality}
  concurrency: ${pipeline.concurrency}
  sync_batch_size: 500
  deduplication_strategy: record_id # Skip existing records before downloading
  enable_record_cache: true

pipeline:
  _target_: buttermilk.pipeline.PipelineOrchestrator
  pipeline_name: zotero_vectorization
  concurrency: 1
  limit: ${run.limit}

  # Source: Zotero library with deduplication filter
  source:
    _target_: buttermilk.libs.zotero.ZoteroSource
    library_id: ${oc.env:ZOTERO_LIBRARY_ID}
    save_dir: ${oc.env:HOME}/.cache/buttermilk/zotero/state
    filter:
      _target_: buttermilk.libs.zotero.VectorStoreExistenceFilter
      vector_store: ${vectoriser}
    force_full_sync: false
    limit: ${run.limit}

  processors:
    # 0. Download PDFs
    - _target_: buttermilk.libs.zotero.ZoteroDownloadProcessor
      library_id: ${oc.env:ZOTERO_LIBRARY_ID}
      save_dir: ${oc.env:HOME}/.cache/buttermilk/zotero/items

    # 0b. HARD GATE: native Zotero citationKey is the single authoritative key.
    # Any item lacking a non-empty native citationKey is EXCLUDED from ingest
    # (never enters ChromaDB) and appended to an actionable report. Runs before
    # any expensive extraction/embedding so excluded items cost nothing.
    - _target_: zotmcp.citation_key_gate.CitationKeyGateProcessor
      log_exclusions: true

    # 1. Extract text using pdftotext (replaces pdfminer extraction)
    - _target_: buttermilk.processors.bash.PDFToTextProcessor

    # 2. Generate citations using LLM
    - _target_: buttermilk.tools.citator.Citator
      model: gemini-flash
      template: citator

    # 2b. Validate and clean LLM-generated citations
    - _target_: zotmcp.citation_validator.CitationValidatorProcessor
      reject_invalid: false  # Mark invalid but don't filter (re-process later)
      attempt_cleanup: true  # Clean whitespace issues automatically
      log_rejections: true

    # 3. Chunk text semantically
    - _target_: buttermilk.data.vector.SemanticSplitter
      chunk_size: 400
      chunk_overlap: 0

    # 3b. Add document metadata prepend to chunks and extract abstract
    - _target_: zotmcp.prepend_processor.PrependProcessor
      min_chunk_size: 80

    # 4. Filter corrupt documents (document-level quality check)
    - _target_: buttermilk.processors.quality.QualityFilterProcessor
      corruption_threshold: 66.0
      pattern_threshold: 80.0

    # 5. Generate embeddings (pure, no side effects)
    - _target_: buttermilk.processors.embeddings.EmbeddingGenerator
      embedding_model: ${storage.zotero_vectors.embedding_model}
      dimensionality: ${storage.zotero_vectors.dimensionality}
      embedding_batch_size: 100
      embedding_max_retries: 5
      embedding_cooldown_seconds: 0.1

    # 5b. Restore original chunk text for storage
    - _target_: zotmcp.prepend_processor.RestoreTextProcessor

    # 6. Store in ChromaDB
    - ${vectoriser}

  output: {}
