# ⚠️ WARNING: This is a MINIMAL MCP server configuration
# DO NOT inherit from zotero.yaml - that adds BigQuery/PubSub/Cloud Logging
# which causes 30-60s blocking init (MCP clients timeout at 30s)
#
# This config includes ONLY:
# - Minimal GCP (Vertex AI for embeddings)
# - ChromaDB storage (async background init)
# - Session management
#
# See commit f37e667 for details on async initialization pattern

defaults:
  - db: upstream # Auto-downloads from GCS on first run
  - _self_

project_name: zotmcp
verbose: true
job: mcp_server

# Minimal GCP infrastructure for Vertex AI embeddings only
# No logging, pubsub, bigquery, or secret_manager to avoid slow blocking initialization
infrastructure:
  clouds:
    - type: gcp
      project_id: prosocial-443205
      credentials_secret: dev__shared_credentials

# Session configuration (required by buttermilk)
session:
  template_paths: []
  sessions_dir: "data/sessions"
  cache_dir: "~/.cache/buttermilk"
  timeout_minutes: 60
  cleanup_interval_minutes: 15
  max_concurrent_sessions: 50

# Minimal GCP infrastructure - only Vertex AI for embeddings
# No BigQuery, PubSub, or Cloud Logging to keep startup fast

# Storage configuration
storage:
  zotero_vectors:
    type: chromadb
    collection_name: prosocial_zot
    read_only: true
    embedding_model: gemini-embedding-001
    dimensionality: 3072

# Metadata fields to extract from Zotero items
zotero_fields:
  bibliographic:
    - title
    - creators
    - date
    - publicationTitle
    - publisher
    - DOI
    - url
    - itemType
    - abstractNote
    - pages
    - volume
    - issue

  technical:
    - item_key
    - document_id
    - chunk_index
    - embedding_model
