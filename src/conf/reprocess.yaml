# @package _global_
# Reprocessing Pipeline for Specific Zotero Items
# Inherits from vectorize.yaml and overrides for forced reprocessing
#
# Usage: uv run python -m buttermilk.runner.cli --config-dir=conf
#     --config-name=reprocess items_file=corrupt_documents_66pct.txt db=dev
#
# Key differences from vectorize.yaml:
# - Uses ZoteroItemSource (file of item keys) instead of ZoteroSource (full library)
# - Forces cache bypass: force_reprocess=true, deduplication_strategy=none
# - Parameterized items_file for flexibility

defaults:
  - vectorize
  - _self_

# Pipeline specific configuration
job: reprocess_zotero

# Reprocessing configuration
items_file: corrupt_documents_66pct.txt # File containing document IDs to reprocess

run:
  mode: pipeline
  limit: null # Process all items in the file

session:
  template_paths:
    - templates

# Override vectoriser to force reprocessing (no deduplication)
vectoriser:
  deduplication_strategy: none # Force reprocessing, don't skip existing records
  enable_record_cache: false # Disable cache for fresh processing

# Override pipeline settings for forced reprocessing
pipeline:
  _target_: buttermilk.pipeline.PipelineOrchestrator
  pipeline_name: zotero_reprocessing
  concurrency: 1
  limit: ${run.limit}
  force_reprocess: true # Ignore all caches and force fresh processing
  enable_record_cache: false # Disable per-processor record caching

  # Source: Fetch specific items by key from file (overrides ZoteroSource)
  source:
    _target_: buttermilk.libs.zotero.ZoteroItemSource
    library_id: ${oc.env:ZOTERO_LIBRARY_ID}
    item_keys_file: ${items_file}
