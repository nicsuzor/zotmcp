# MCP Server Configuration
# Inherits base zotero config including GCP infrastructure needed for embeddings
# Fast startup is maintained via background ChromaDB initialization in main.py

defaults:
  - zotero # Inherit base configuration including GCP infrastructure
  - db: deploy # Use deploy for Docker, override with db=dev for local
  - _self_

# MCP server specific configuration
job: mcp_server
project_name: zotmcp
verbose: true
